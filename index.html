<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-shirty | تيشيرتي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--surface:#fff;--ink:#1d1b1a;--mut:#6d6862;--line:#e3ded6;--acc:#22304a;--acc-t:#fff;--logo:#22304a;--hero:#1d1b1a;--hero-t:#f6f3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161413;--surface:#211e1c;--ink:#f3eee8;--mut:#a39d95;--line:#35302c;--acc:#9db4e0;--acc-t:#0e1626;--logo:#f3eee8;--hero:#0e0d0c;--hero-t:#f3eee8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161413;--surface:#211e1c;--ink:#f3eee8;--mut:#a39d95;--line:#35302c;--acc:#9db4e0;--acc-t:#0e1626;--logo:#f3eee8;--hero:#0e0d0c;--hero-t:#f3eee8;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;margin-inline-end:auto}
.brand svg{width:40px;height:40px}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:8px;font-size:.95rem}
nav a:hover{background:var(--bg)}
.cartbtn{position:relative;padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:500;font-size:.95rem}
.cnt{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:var(--acc-t);font-size:.75rem;display:grid;place-items:center;padding:0 5px}
main{max-width:1100px;margin:auto;padding:0 16px 40px}
.hero{margin-top:16px;border-radius:20px;background:var(--hero);color:var(--hero-t);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;overflow:hidden}
.hero .t{padding:48px 40px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.25;margin:0 0 12px}
.hero p{margin:0 0 24px;opacity:.8;max-width:420px}
.hero .im{height:100%;min-height:280px;background:#2b2725;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.hero .im img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-block;padding:12px 28px;border-radius:10px;background:var(--acc);color:var(--acc-t);font-weight:700}
.btn.full{width:100%;text-align:center;padding:14px}
.btn:hover{filter:brightness(1.12)}
h2{font-size:1.7rem;margin:48px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:start;position:relative}
.card .ph{aspect-ratio:4/5;background:#ebe7e0;position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--acc);color:var(--acc-t);padding:3px 12px;border-radius:99px;font-size:.85rem;font-weight:700}
.en{color:var(--mut);font-size:.85rem;direction:ltr;text-align:start}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:1.3rem}
.price s{color:var(--mut)}
.dots{display:flex;gap:6px}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.about{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.about p{margin:0;max-width:620px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.perks div{padding:12px 14px;border-radius:10px;background:var(--bg);font-weight:500}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:24px}
.detail .ph{border-radius:16px;overflow:hidden;background:#ebe7e0;position:relative;aspect-ratio:4/5}
.detail .ph img{width:100%;height:100%;object-fit:cover}
.detail h1{margin:0}
.back{display:inline-block;margin-top:16px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;margin:18px 0;flex-wrap:wrap}
.lbl{font-weight:700;min-width:70px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 3px var(--surface)}
.sw[aria-checked="true"]{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:2px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.qty button{width:40px;height:40px;font-size:1.2rem}
.qty span{min-width:40px;text-align:center;font-weight:700}
.save{color:var(--acc);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(420px,100%);background:var(--surface);z-index:41;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line);font-weight:700;font-size:1.15rem}
.items{flex:1;overflow-y:auto;padding:8px 16px}
.it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.it img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.it .i{flex:1;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.it .rm{color:var(--acc);font-size:.85rem;align-self:flex-start}
.mini{display:flex;align-items:center;gap:8px}
.mini button{width:28px;height:28px;border:1px solid var(--line);border-radius:8px}
.df{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem}
.empty{text-align:center;color:var(--mut);padding:48px 0}
.modal{position:fixed;z-index:42;inset:0;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.mb{background:var(--surface);border-radius:16px;padding:24px;width:min(440px,100%);max-height:90%;overflow-y:auto}
.mb h3{margin:0 0 12px}
.mb input,.mb textarea{width:100%;font:inherit;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
footer{background:var(--hero);color:var(--hero-t);padding:32px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.fi{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.soc{display:flex;gap:10px}
.soc a{padding:6px 14px;border:1px solid rgba(255,255,255,.3);border-radius:99px;font-size:.9rem}
.cp{max-width:1100px;margin:16px auto 0;opacity:.6;font-size:.85rem}
@media (max-width:720px){
.hero{grid-template-columns:1fr}.hero .t{padding:32px 24px}.hero .im{min-height:200px}
.detail{grid-template-columns:1fr;gap:20px}
nav a{padding:6px 8px;font-size:.88rem}.bar{gap:8px}.brand span{font-size:1rem}
}
